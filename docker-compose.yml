version: "3.9"

services:
  mongo:
    container_name: mongo
    image: mongo:6
    restart: always
    ports:
      - "27017:27017" # Allows you to connect via Compass/TablePlus on your host
    volumes:
      - ./mongo-data:/data/db # Persists your data even if the container stops

  backend_new:
    container_name: backend_new
    build: ./backend
    ports:
      - "4001:4001"
    restart: always
    environment:
      - NODE_ENV=development
      # Internal connection: 'mongo' is the service name defined above
      - MONGO_URI=mongodb://mongo:27017/mydatabase
      - FRONTEND_URL=http://localhost:4000
    depends_on:
      - mongo
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    container_name: frontend_v2
    build: ./frontend
    ports:
      - "4000:3000"
    environment:
      # Browser connection: Accesses the backend via the exposed port on host
      - NEXT_PUBLIC_API_URL=http://localhost:4001
    depends_on:
      - backend_new
    restart: always
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next